<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Games</title>
<style>
  body{margin:0;min-height:100vh;font-family:"Segoe UI",system-ui,sans-serif;color:#ece6f5;
    background:radial-gradient(ellipse at top,#2a2040,#17121f 50%,#0d0a12) fixed;display:flex;flex-direction:column;align-items:center;padding:40px 16px}
  h1{font-family:Georgia,serif;color:#e9c46a;letter-spacing:.1em;margin:0 0 8px}
  p.sub{color:#a99cbc;margin:0 0 32px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;max-width:760px;width:100%}
  a.card{display:block;text-decoration:none;color:inherit;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);
    border-radius:14px;padding:22px;transition:transform .15s,border-color .15s}
  a.card:hover{transform:translateY(-3px);border-color:#e9c46a}
  .card h2{margin:0 0 8px;font-family:Georgia,serif;color:#e9c46a}
  .card p{margin:0;color:#c9bedb;line-height:1.5}
  .play{display:inline-block;margin-top:14px;color:#e9c46a;font-weight:600}
</style>
</head>
<body>
  <h1>GAMES</h1>
  <p class="sub">Pick a game to play in your browser.</p>
  <div class="grid">
    <a class="card" href="ashes-of-hollowmere/">
      <h2>Ashes of Hollowmere</h2>
      <p>A text adventure with combat and magic. Choose a Warrior, Mage or Rogue and defeat the Hollow King.</p>
      <span class="play">Play →</span>
    </a>
    <a class="card" href="realmspire/">
      <h2>Realmspire</h2>
      <p>Chess across three stacked realms. Play against a friend or a bot with three difficulty levels.</p>
      <span class="play">Play →</span>
    </a>
  </div>
</body>
</html>
